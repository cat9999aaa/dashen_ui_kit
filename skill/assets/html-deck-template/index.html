<!doctype html>
<html lang="zh" data-theme="void" data-palette="phosphor">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EXOFRAME HTML Deck Template</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body class="deck-body">
    <main class="deck-shell">
      <section class="deck-slide">
        <p class="eyebrow">// EXOFRAME HTML PPT</p>
        <h1 class="deck-title">TITLE</h1>
        <p class="deck-lead">Replace this with a sharp deck statement.</p>
      </section>
      <section class="deck-slide" hidden>
        <p class="eyebrow">// SECTION</p>
        <h2 class="deck-heading">One idea per slide.</h2>
      </section>
    </main>
    <footer class="deck-controls">
      <button class="exo-button" data-deck-prev type="button">PREV</button>
      <span data-deck-counter>1 / 2</span>
      <button class="exo-button" data-variant="primary" data-deck-next type="button">NEXT</button>
    </footer>
    <script src="./deck.js" type="module"></script>
  </body>
</html>
